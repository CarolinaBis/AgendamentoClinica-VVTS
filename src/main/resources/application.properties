spring.application.name=agendamento-clinica

# --- SQLite via JDBC (sem JPA/Hibernate) ----------------------------------------
spring.datasource.url=jdbc:sqlite:database.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
# O esquema (inclusive a tabela app_user) vem de schema.sql, executado a cada inicialização.
spring.sql.init.mode=always
# SQLite aceita um único escritor: pool de 1 conexão evita "database is locked" (o base usava 5).
spring.datasource.hikari.maximum-pool-size=1

spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG

# --- Swagger / OpenAPI (do projeto base) ------------------------------------------
springdoc.swagger-ui.path=/api/v1/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.operationsSorter=alpha

# --- JWT (do projeto base) ----------------------------------------------------------
